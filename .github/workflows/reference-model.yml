name: Reference model differential test

# Issue #1240: compare the independent Python reference model against the
# contract on 100,000 generated operation sequences every night.
#
# Issue #1455: the reference model is only as valuable as the completeness of
# what it actually models. Every function the model claims to cover must be
# exercised by fixtures spanning a genuinely representative range of its input
# space (including documented boundary and adversarial values), not just the
# narrow slice the original fixtures happened to hit. The per-function
# characterization of fixture coverage versus real input space is published in
# the coverage report at:
#
#     tools/reference-model/COVERAGE.md
#
# Any newly modeled function MUST ship with representative fixture coverage and
# a corresponding entry in that coverage report; additions that claim coverage
# without it will be held to the same bar and rejected in review. See the
# coverage report for the current mapping of each modeled function to its
# fixture coverage characterization.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      sequences:
        description: "Number of generated sequences"
        default: "100000"
  pull_request:
    paths:
      - "tools/reference-model/**"
      - "docs/score-math.md"

env:
  CARGO_TERM_COLOR: always

jobs:
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.81.0
      - uses: Swatinem/rust-cache@v2
      - name: Reference model unit tests
        # Fixture coverage for every modeled function is characterized in
        # tools/reference-model/COVERAGE.md (see issue #1455).
        run: python3 -m unittest discover -v tools/reference-model
      - name: Build contract driver
        run: cargo build --release --locked -p reference-model-driver
      - name: Differential run
        run: |
          n="${{ github.event.inputs.sequences }}"
          [ "${{ github.event_name }}" = "pull_request" ] && n=5000
          python3 tools/reference-model/run_diff.py --sequences "${n:-100000}" --seed "${{ github.run_id }}"
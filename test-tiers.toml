# test-tiers.toml — the machine-readable test inventory and tier manifest
#
# Issue #1244. The authoritative statement of *what test exists, why it exists,
# and which run executes it*. `docs/test-tiers.md` is the prose companion;
# `scripts/test-tier.sh` is the only command a contributor needs locally.
#
# ── Model ──────────────────────────────────────────────────────────────────────
#
# A **test unit** is the granularity the tiers are defined over. A unit is one
# of:
#
#   * a `#[cfg(test)]` module of a library target — `contracts/ledgerlens-score/
#     src/test_upgrade.rs` and its siblings;
#   * an integration-test target — `tests/composability/tests/sdk_conformance.rs`;
#   * a doctest target — `contracts/ledgerlens-score::doctests`;
#   * a shell or python suite — `tests/deploy/test_deploy.sh`;
#   * a stray test file under `tests/` that belongs to no cargo target.
#
# Every unit carries a `kind` (its purpose) and a `tier` (what runs it). The
# tiers partition the suite: a unit belongs to exactly one of them, and
# `fast ∪ standard ∪ nightly` is exactly the set of units a cargo target
# actually compiles. `disabled` is not a run — it records a test file that is
# present in the tree but wired into nothing, which is a state CI now pins
# rather than ignores.
#
# ── Why `disabled` is in this file ────────────────────────────────────────────
#
# 81 of the 138 test-carrying modules in `contracts/ledgerlens-score/src/` are
# not declared in `src/lib.rs` (17 are commented out, 64 were never wired), the
# same holds for 5 modules in `contracts/ledgerlens-aggregator` and
# `tools/replay`, and `tests/doc_sync_check.rs` is not inside any cargo target.
# 87 units in total, whose tests have never run. Each one is listed below as
# `disabled` with the evidence for its state, so:
#
#   * adding `mod test_foo;` to `src/lib.rs` without classifying `test_foo`
#     fails the `check` gate (the suite is live but unreachable from a tier);
#   * un-wiring a live suite again fails the gate until the manifest records it
#     as `disabled` with a reason, and that edit is a reviewed tier move.
#
# Triaging the disabled modules into live tiers (or deleting them) is tracked
# as follow-up work in docs/test-tiers.md § Disabled inventory.
#
# ── Gates enforced on this file ───────────────────────────────────────────────
#
#   python3 tools/test-tiering.py check             # completeness, tiers, budgets
#   python3 tools/test-tiering.py check --base main # ... and no unreviewed tier move
#
# Reviewed-change policy: a unit's `kind`, `tier`, or a tier's budget may only
# change together with a `reviewed = { by, on, note }` annotation on the same
# entry. `--base` diffs against any revision (a git rev or a manifest path) and
# fails the build when a change is unannotated, so a test cannot quietly be
# demoted out of PR coverage.
#
# Everything below the generated marker is machine-written. Re-generate it with
#   python3 tools/test-tiering.py bootstrap --write
# and review the diff: the bootstrap heuristics (tools/test-tiering.py) only
# propose a `kind` and a `tier`; every deliberate deviation from a kind's
# default tier must carry a `reason`, and a human owns those.

schema_version = 1

# Reference runner for the budgets below. Budgets are wall-clock ceilings for
# *test execution*, measured with the build already warm (CI pre-builds the
# test binaries; the build cost is reported separately as `build_budget_seconds`
# and is not enforced, because a cold `lto = true` release build of this
# workspace is dominated by compilation rather than by anything under test).
[runner]
model = "GitHub-hosted ubuntu-latest (2 vCPU, 7 GB RAM)"
toolchain = "1.81.0 (rust-toolchain.toml)"
provider = "cargo test, or cargo-nextest when it is installed (docs/test-tiers.md § Provider)"

# ── Execution tiers ───────────────────────────────────────────────────────────

[tiers.fast]
description = """The pre-push and per-PR feedback loop: contract entry-point behaviour, \
the advertised interface and error surface, governance and rate-limit units, \
conformance, and the cheap shell/python checks. Budget: 3 minutes of execution on \
the reference runner. A PR that adds a slow test must classify it honestly or the \
`test-tiers-fast` job fails and forces the conversation."""
command = "scripts/test-tier.sh fast"
runs_on = ["pull_request", "push:main", "local pre-push"]
execution_budget_seconds = 180
build_budget_seconds = 900

[tiers.standard]
description = """Everything that is correct to run on every PR but too slow or too \
broad for the 3-minute feedback loop: cross-contract composability, the replay \
tool, deploy-script and drift suites, attested-batch and privacy suites. Budget: \
30 minutes of execution on the reference runner."""
command = "scripts/test-tier.sh standard"
runs_on = ["pull_request", "push:main", "local"]
execution_budget_seconds = 1800
build_budget_seconds = 900

[tiers.nightly]
description = """The rest: resource-exhaustion and hostile-read stress suites, \
property/fuzz suites, long-horizon soak suites, and the cargo-mutants \
kill-suites. Budget: 60 minutes of execution on the reference runner. Runs in \
`.github/workflows/nightly-tests.yml`, and these are the units that used to \
have no scheduled home at all."""
command = "scripts/test-tier.sh nightly"
runs_on = ["nightly cron", "manual"]
execution_budget_seconds = 3600
build_budget_seconds = 1800

# ── Purpose taxonomy ──────────────────────────────────────────────────────────
#
# `default_tier` is where a purpose normally belongs. A unit may deviate, but
# only with a `reason` on the unit — that is what makes the deviation reviewable
# instead of accidental.

[kinds.smoke]
description = "The 'if this breaks, stop' set: core entry points, the advertised interface, the error surface, executable invariants, and the runnable doc examples."
default_tier = "fast"

[kinds.unit]
description = "A single function or single storage key in isolation: validation branches, getters, setters, event shape."
default_tier = "fast"

[kinds.integration]
description = "More than one contract, or one contract's lifecycle: composability, conformance, cross-contract failover, governance/upgrade flows, attestation domain compatibility, replay and deploy tooling."
default_tier = "standard"

[kinds.property]
description = "Asserts a property over generated or randomised inputs rather than a fixed example: fuzz seeds, chaos sequences, monotonicity, bounded drift, invariant sweeps."
default_tier = "standard"

[kinds.stress]
description = "Asserts bounded work under hostile or maximum-sized input: denial-of-service read patterns, memory exhaustion, panic-path guards, high-cardinality sweeps, malformed-input corpora."
default_tier = "nightly"

[kinds.soak]
description = "Walks a long horizon: TTL renewal, score-history depth, epoch and decay progression. Slow by construction; correctness of the curve matters more than turnaround."
default_tier = "nightly"

[kinds.mutation]
description = "Exists primarily as the kill-suite for a cargo-mutants shard: commitment-proof and cryptography code where line coverage is not evidence of test strength. Modules that merely appear in a shard's `--test` list are classified by their behavioural purpose and cross-referenced with `mutation_shards` instead."
default_tier = "nightly"

# ── Benchmarks (classified, deliberately outside the tiers) ────────────────────
#
# Criterion suites measure cost; they do not assert behaviour, so a failing
# benchmark is data, not a gate. They are still classified (so nothing in the
# tree is unaccounted for) but they are not part of the tier partition: running
# them needs a release-profile build of this workspace (`lto = true`,
# `codegen-units = 1`), which costs more wall-clock than any tier budget and
# would only ever time out. Run them on demand with the command recorded on
# each entry; `docs/resource-budgets.md` documents the thresholds.

